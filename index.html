<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Github</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <header>
        <div class="container">
            <img class="profile-avatar" src="https://via.placeholder.com/180x180" alt=".">
            <h1 class="profile-name">Mateus Alves</h1>
            <h2 class="profile-username">@mateusmalves</h2>
            <ul class="numbers">
                <li class="numbers-item">
                    <h4>Repositórios</h4>
                    5
                </li>
                <li class="numbers-item">
                    <h4>Seguidores</h4>
                    5
                </li>
                <li class="numbers-item">
                    <h4>Seguindo</h4>
                    5
                </li>
            </ul>
            <a href="#" class="profile-link">Ver no Github</a>
        </div>
    </header>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const username = "mateusmalves";
            const apiUrl = `https://api.github.com/users/mateusmalves`;
            fetch(apiUrl)
                .then(response => {
                    if (!response.ok) {
                        throw new Error("Erro ao buscar os dados da API");
                    }
                    return response.json();
                })
                .then(data => {
                    document.querySelector(".profile-avatar").src = data.avatar_url;
                    document.querySelector(".profile-name").textContent = data.name || "Nome não disponível";
                    document.querySelector(".profile-username").textContent = `@${data.login}`;
                    document.querySelector(".numbers-item:nth-child(1) h4").nextSibling.textContent = data.public_repos;
                    document.querySelector(".numbers-item:nth-child(2) h4").nextSibling.textContent = data.followers;
                    document.querySelector(".numbers-item:nth-child(3) h4").nextSibling.textContent = data.following;
                    document.querySelector(".profile-link").href = data.html_url;
                })
                .catch(error => {
                    console.error("Erro:", error);
                });
        });
    </script>
</body>
</html>
